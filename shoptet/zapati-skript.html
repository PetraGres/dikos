<!-- Nehtík → košík Dikos
     Vložit v Shoptetu: Vzhled a obsah → Editor → HTML kód → Zápatí.
     Odkaz z aplikace: https://www.dikos-kosmetika.cz/?nehtik_add=KÓD:KUSY,KÓD:KUSY
     Produkty se přičtou ke stávajícímu košíku zákaznice a pak se otevře košík. -->
<script>
(function () {
  var PARAM = 'nehtik_add';
  var MAX_ITEMS = 20;
  var MAX_AMOUNT = 10;
  var CODE_RE = /^[A-Za-z0-9._\/-]{1,64}$/;

  var params = new URLSearchParams(window.location.search);
  var raw = params.get(PARAM);
  if (!raw) return;

  // Parametr hned odstranit z adresy, aby obnovení stránky nevložilo zboží znovu.
  params.delete(PARAM);
  var query = params.toString();
  history.replaceState(null, '', location.pathname + (query ? '?' + query : '') + location.hash);

  var items = raw.split(',').slice(0, MAX_ITEMS).map(function (part) {
    var bits = part.split(':');
    var amount = parseInt(bits[1], 10) || 1;
    return { code: (bits[0] || '').trim(), amount: Math.min(Math.max(amount, 1), MAX_AMOUNT) };
  }).filter(function (item) { return CODE_RE.test(item.code); });
  if (!items.length) return;

  function cartApi() {
    return window.shoptet && shoptet.cartShared && typeof shoptet.cartShared.addToCart === 'function';
  }

  // Jedna položka: počkat na událost Shoptetu o změně košíku (nebo nejdéle 4 s).
  function addOne(item, done) {
    var finished = false;
    var timer;
    function finish() {
      if (finished) return;
      finished = true;
      clearTimeout(timer);
      document.removeEventListener('ShoptetCartUpdated', finish);
      done();
    }
    document.addEventListener('ShoptetCartUpdated', finish);
    timer = setTimeout(finish, 4000);
    try {
      // true = bez vyskakovacího okna „přidáno do košíku“
      var result = shoptet.cartShared.addToCart({ productCode: item.code, amount: item.amount }, true);
      if (result && typeof result.then === 'function') result.then(finish, finish);
    } catch (e) {
      if (window.console) console.warn('Nehtík: produkt ' + item.code + ' se nepodařilo vložit', e);
      finish();
    }
  }

  // Postupně, jednu položku po druhé – souběžné požadavky by se mohly předběhnout.
  function addAll(index) {
    if (index >= items.length) {
      window.location.href = '/kosik/';
      return;
    }
    addOne(items[index], function () { addAll(index + 1); });
  }

  function start(attempt) {
    if (cartApi()) return addAll(0);
    if (attempt < 50) return setTimeout(function () { start(attempt + 1); }, 100);
    if (window.console) console.warn('Nehtík: košíkové API Shoptetu není k dispozici');
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', function () { start(0); });
  } else {
    start(0);
  }
})();
</script>
