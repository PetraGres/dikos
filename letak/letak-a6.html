<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<title>Nehtík – letáček A6</title>
<style>
  @page { size: 105mm 148mm; margin: 0; }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: #2b2024; }
  .page {
    width: 105mm; height: 148mm; padding: 10mm 9mm 0;
    background: #fbf6f4; display: flex; flex-direction: column; align-items: center; text-align: center;
  }
  .brand { display: flex; align-items: center; gap: 2.5mm; font-weight: 800; font-size: 15pt; }
  .brand img { width: 9mm; height: 9mm; }
  .brand span { font-weight: 400; color: #7a6a70; font-size: 10pt; }
  h1 { font-size: 18pt; line-height: 1.15; margin: 6mm 0 3mm; color: #5a1f36; }
  .lead { font-size: 10pt; line-height: 1.4; margin: 0 0 6mm; max-width: 78mm; }
  .qr { background: #fff; border-radius: 4mm; padding: 2.5mm; }
  .qr img { width: 38mm; height: 38mm; display: block; }
  .scan { font-weight: 700; margin: 3mm 0 0; font-size: 10.5pt; }
  .contact {
    margin-top: auto; width: calc(100% + 18mm); padding: 5mm 9mm 6mm;
    background: #5a1f36; color: #fff;
  }
  .contact small { display: block; font-size: 8pt; opacity: .8; margin-bottom: 1mm; }
  .contact strong { font-size: 14pt; letter-spacing: .2pt; }
</style>
</head>
<body>
  <div class="page">
    <div class="brand"><img src="../icon.svg" alt="">Nehtík <span>by Dikos</span></div>
    <h1>Děkujeme za nákup! 💅</h1>
    <p class="lead">Krásné nehty i doma. Naskenuj kód a&nbsp;průvodce tě provede krok za krokem – i&nbsp;s&nbsp;časovačem lampy.</p>
    <div class="qr"><img src="nehtik-qr.svg" alt="QR kód aplikace Nehtík"></div>
    <p class="scan">Naskenuj telefonem 📱</p>
    <div class="contact">
      <small>Materiál a další produkty najdeš na</small>
      <strong>www.dikos-kosmetika.cz</strong>
    </div>
  </div>
</body>
</html>
